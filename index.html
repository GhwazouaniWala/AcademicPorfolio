    <script>
      // Stamp the theme before first paint so there is no flash of the wrong
      // surface. Kept inline and tiny on purpose — it must run before CSS.
      (function () {
        try {
          var stored = localStorage.getItem("wg-theme");
          var explicit = localStorage.getItem("wg-theme-explicit");
          var theme =
            explicit && (stored === "light" || stored === "dark")
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "light" ? "#f6f4ef" : "#080a0f");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
